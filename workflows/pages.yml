name: Build apps and deploy to Pages

on:
  workflow_dispatch:
    inputs:
      apps:
        description: '逗号分隔的应用目录名（上游 src/<name>，如 spreadsheet,documents,notes）'
        required: true
        default: 'spreadsheet'
      ref:
        description: '上游分支或标签'
        required: true
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this kit
        uses: actions/checkout@v4

      # 不 clone 上游（1.3 GB 历史）：直接拿 tarball
      - name: Fetch upstream source
        run: |
          set -euo pipefail
          curl -L --retry 3 -o upstream.tar.gz \
            "https://codeload.github.com/HeyPuter/everything/tar.gz/refs/heads/${{ inputs.ref }}"
          mkdir -p upstream
          tar xzf upstream.tar.gz -C upstream --strip-components=1
          du -sh upstream

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build requested apps
        run: |
          set -euo pipefail
          SITE="$PWD/site"
          mkdir -p "$SITE"
          for app in $(echo "${{ inputs.apps }}" | tr ',' ' '); do
            [ -d "upstream/src/$app" ] || { echo "unknown app: $app"; exit 1; }
            echo "::group::build $app"
            pushd "upstream/src/$app" >/dev/null
            npm ci --no-audit --no-fund --ignore-scripts
            # 可选：把协作 worker 一起构建（产物进 public/worker，由主构建带走）
            if node -e "process.exit(require('./package.json').scripts['build:worker']?0:1)"; then
              npm run build:worker || echo "worker build failed (continuing)"
            fi
            # --base ./：让产物可以放在任意子路径（Page 站点是 /<repo>/）
            npx vite build --base ./
            mkdir -p "$SITE/$app"
            cp -r dist/. "$SITE/$app/"
            popd >/dev/null
            echo "::endgroup::"
          done
          node scripts/gen-launcher.mjs site
          du -sh site/*

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
